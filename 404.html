  p { margin: 0; color: #E2DACA; }
  a.btn { display: inline-flex; align-items: center; min-height: 52px; padding: 0 26px; border-radius: 999px; background: #F2ECDF; color: #1E2A4A; font-weight: 800; text-decoration: none; }
  a.btn:hover { background: #fff; }
  a:focus-visible { outline: 2px solid #F2ECDF; outline-offset: 3px; }
